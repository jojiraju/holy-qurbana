<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Holy Qurbana Invitation - Angel Nisha Joseph</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="split-container">
    <!-- Left Half: Image -->
    <div class="image-half">
      <img src="/girl.png" alt="Angel Nisha Joseph">
    </div>
    
    <!-- Right Half: Content -->
    <div class="content-half">
      <div class="content-inner fade-in-up">
        
        <div class="ornament">
          <svg width="40" height="20" viewBox="0 0 40 20" fill="none" stroke="var(--color-primary)" stroke-width="1.5">
            <path d="M20 0 L20 20 M0 10 Q20 10 20 20 Q20 10 40 10" fill="transparent"/>
          </svg>
        </div>

        <p class="subtitle">With the Grace of God</p>
        <h1 class="main-title">First Holy Qurbana</h1>
        <h2 class="honoree-name">Angel Nisha Joseph</h2>
        
        <div class="divider">
          <div class="diamond"></div>
        </div>

        <div class="details-list">
           <div class="detail-row">
              <span class="detail-label">Date</span>
              <span class="detail-value">Sunday, 16 August 2026</span>
           </div>
           <div class="detail-row">
              <span class="detail-label">Church</span>
              <span class="detail-value">St George Malankara Catholic Church, Edakkara</span>
           </div>
           <div class="detail-row">
              <span class="detail-label">Reception</span>
              <span class="detail-value">Berit Food Court, Edakkara <br> <small>12:00 PM Onwards</small></span>
           </div>
        </div>
        
        <p class="verse">"I am the bread of life. Whoever comes to me will never go hungry."</p>
        
      </div>
    </div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
